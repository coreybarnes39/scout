name: Scout Daily

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile name (blank = all enabled)'
        required: false
        type: string
      debug:
        description: 'Verbose source/filter logging'
        required: false
        type: boolean
        default: true
      dry_run:
        description: 'Do not write to Google Sheets'
        required: false
        type: boolean
        default: false

  schedule:
    - cron: '17 12 * * *'

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q scout

      - name: Run Scout
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          PROFILE: ${{ inputs.profile }}
          DEBUG: ${{ inputs.debug }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          python -m scout.main \
            --profile "$PROFILE" \
            $([[ "$DEBUG" == "true" ]] && echo "--debug") \
            $([[ "$DRY_RUN" == "true" ]] && echo "--dry-run")