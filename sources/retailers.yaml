# Sites using experimental sitemap discovery; validate feed coverage before relying on them.

# Sitemap + JSON-LD discovery candidates; each must be validated in run logs.
# This connector is intentionally bounded and honors robots.txt.
trek:
  name: Trek Bikes
  type: sitemap_products
  base_url: https://www.trekbikes.com
  category_urls: ['/us/en_US/bikes/road-bikes/gravel-bikes/c/B546/', '/us/en_US/search/?text=checkpoint']
  product_url_pattern: '(checkpoint|checkmate|gravel)'
  product_path_pattern: '/(?:a|f)/'
  category_path_pattern: '/c/'
  category_depth: 3
  max_category_pages: 16
  max_sitemaps: 5
  max_products: 20

specialized:
  name: Specialized
  type: sitemap_products
  base_url: https://www.specialized.com
  category_urls: ['/us/en/shop/bikes/road-bikes/gravel-bikes/c/roadgravel', '/us/en/search/?text=diverge']
  product_url_pattern: '(diverge|crux|gravel)'
  max_sitemaps: 5
  max_products: 20

jenson:
  name: Jenson USA
  type: sitemap_products
  base_url: https://www.jensonusa.com
  category_urls: ['/gravel-bikes', '/search?query=gravel']
  product_url_pattern: '(gravel|checkpoint|diverge|crux|terra|urs|revolt)'
  max_sitemaps: 5
  max_products: 20

